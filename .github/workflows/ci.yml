name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install test dependency only
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest

      - name: Compile Python files
        run: |
          python -m compileall src tools tests

      - name: Verify CLI import boundary without local extras
        env:
          PYTHONPATH: src:.
        run: |
          python -m smdebate.cli --help

      - name: Generate synthetic dataset smoke file
        run: |
          python tools/generate_synthetic_dataset.py --out data/generated/synthetic_minimal_90.jsonl --seed 0 --n-per-type 30
          test -s data/generated/synthetic_minimal_90.jsonl

      - name: Run contract tests
        env:
          PYTHONPATH: src:.
        run: |
          python -m pytest -q
