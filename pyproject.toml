[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "same-model-debate-lab"
version = "0.1.0"
description = "Local LLM experiment harness for testing same-model debate collapse."
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "ruff>=0.8.0",
]
local = [
  "langchain-openai>=0.3.0",
  "pandas>=2.0.0",
  "streamlit>=1.0.0",
]

[project.scripts]
smdebate = "smdebate.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
